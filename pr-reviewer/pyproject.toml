[project]
name = "pr-reviewer"
version = "0.1.0"
description = "AI code review agent: Claude Agent SDK + GitHub API + pytest-verified findings"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pr-reviewer = "reviewer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
